<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT — Bank Transaction Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --gray-1: #1a1a1a;
    --gray-2: #2e2e2e;
    --gray-3: #555;
    --gray-4: #999;
    --gray-5: #ccc;
    --accent: #e8e8e0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.03) 39px, rgba(255,255,255,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--gray-2);
    padding-bottom: 20px;
    margin-bottom: 48px;
    animation: slideDown 0.6s ease both;
  }

  .logo {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1;
  }

  .logo span {
    font-family: 'Poppins', sans-serif;
    font-size: 0.22em;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--gray-4);
    display: block;
    margin-top: 4px;
  }

  .header-time {
    font-size: 0.72rem;
    font-weight: 300;
    color: var(--gray-4);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: right;
  }

  /* Balance card */
  .balance-card {
    background: var(--gray-1);
    border: 1px solid var(--gray-2);
    border-top: 3px solid var(--white);
    padding: 36px 40px;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
    animation: slideUp 0.6s ease 0.1s both;
  }

  .balance-card::after {
    content: '₿';
    position: absolute;
    right: -10px;
    bottom: -30px;
    font-size: 10rem;
    color: rgba(255,255,255,0.03);
    font-family: 'UnifrakturMaguntia', serif;
    pointer-events: none;
  }

  .balance-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gray-4);
    margin-bottom: 8px;
  }

  .account-name {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.4rem;
    color: var(--gray-5);
    margin-bottom: 20px;
  }

  .balance-amount {
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--white);
  }

  .balance-amount .currency {
    font-size: 0.4em;
    font-weight: 300;
    vertical-align: top;
    margin-top: 8px;
    color: var(--gray-4);
  }

  .warning-banner {
    display: none;
    margin-top: 20px;
    padding: 10px 16px;
    border: 1px solid var(--gray-3);
    border-left: 3px solid var(--white);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--gray-5);
    text-transform: uppercase;
  }

  .warning-banner.show { display: block; }

  /* Grid layout */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 40px;
    animation: slideUp 0.6s ease 0.2s both;
  }

  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  /* Action panels */
  .panel {
    background: var(--gray-1);
    border: 1px solid var(--gray-2);
    padding: 28px 28px 24px;
    transition: border-color 0.2s;
  }

  .panel:hover { border-color: var(--gray-3); }

  .panel-title {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.5rem;
    margin-bottom: 18px;
    color: var(--gray-5);
  }

  .input-group {
    position: relative;
    margin-bottom: 14px;
  }

  .input-prefix {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--gray-3);
  }

  input[type="number"] {
    width: 100%;
    background: var(--black);
    border: 1px solid var(--gray-2);
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    padding: 12px 14px 12px 30px;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  input[type="number"]:focus { border-color: var(--white); }

  .btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--gray-3);
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:hover {
    background: var(--white);
    color: var(--black);
    border-color: var(--white);
  }

  .btn-deposit:hover { background: var(--white); }
  .btn-withdraw:hover { background: var(--white); }

  .msg {
    margin-top: 10px;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 1px;
    min-height: 16px;
    text-transform: uppercase;
    color: var(--gray-4);
  }

  .msg.error { color: #bbb; }
  .msg.success { color: var(--white); }

  /* Transaction history */
  .history-panel {
    background: var(--gray-1);
    border: 1px solid var(--gray-2);
    animation: slideUp 0.6s ease 0.3s both;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--gray-2);
  }

  .history-title {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1.5rem;
    color: var(--gray-5);
  }

  .tx-count {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gray-4);
  }

  .history-list {
    max-height: 320px;
    overflow-y: auto;
  }

  .history-list::-webkit-scrollbar { width: 2px; }
  .history-list::-webkit-scrollbar-track { background: var(--gray-1); }
  .history-list::-webkit-scrollbar-thumb { background: var(--gray-3); }

  .tx-empty {
    padding: 40px 28px;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gray-3);
    text-align: center;
  }

  .tx-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 16px 28px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    animation: fadeIn 0.3s ease both;
  }

  .tx-icon {
    width: 32px;
    height: 32px;
    border: 1px solid var(--gray-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
    color: var(--gray-4);
  }

  .tx-info {}

  .tx-type {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1rem;
    color: var(--gray-5);
    line-height: 1.2;
  }

  .tx-date {
    font-size: 0.6rem;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--gray-3);
    text-transform: uppercase;
  }

  .tx-amount {
    text-align: right;
  }

  .tx-value {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--white);
  }

  .tx-value.deposit { color: var(--white); }
  .tx-value.withdrawal { color: var(--gray-4); }

  .tx-balance {
    font-size: 0.6rem;
    font-weight: 300;
    color: var(--gray-3);
    letter-spacing: 1px;
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--gray-2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeIn 0.6s ease 0.4s both;
  }

  .footer-brand {
    font-family: 'UnifrakturMaguntia', serif;
    font-size: 1rem;
    color: var(--gray-3);
  }

  .footer-note {
    font-size: 0.6rem;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray-3);
  }

  /* Animations */
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Flash effect on balance update */
  @keyframes balanceFlash {
    0% { color: var(--white); }
    30% { color: var(--gray-4); }
    100% { color: var(--white); }
  }

  .flash { animation: balanceFlash 0.5s ease; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      Vault
      <span>Transaction Manager</span>
    </div>
    <div class="header-time" id="clock">
      <div id="time-display">—</div>
      <div style="margin-top:4px;">Session Active</div>
    </div>
  </header>

  <!-- Balance Card -->
  <div class="balance-card">
    <div class="balance-label">Account Balance</div>
    <div class="account-name" id="account-name">Ali Khan</div>
    <div class="balance-amount">
      <span class="currency">$</span><span id="balance-display">50,000.00</span>
    </div>
    <div class="warning-banner" id="warning-banner">
      ⚠ Balance below $10,000 — consider depositing additional funds
    </div>
  </div>

  <!-- Action panels -->
  <div class="grid">
    <!-- Deposit -->
    <div class="panel">
      <div class="panel-title">Deposit</div>
      <div class="input-group">
        <span class="input-prefix">$</span>
        <input type="number" id="deposit-input" placeholder="0.00" min="0.01" step="0.01">
      </div>
      <button class="btn btn-deposit" onclick="handleDeposit()">— Deposit Funds —</button>
      <div class="msg" id="deposit-msg"></div>
    </div>

    <!-- Withdraw -->
    <div class="panel">
      <div class="panel-title">Withdraw</div>
      <div class="input-group">
        <span class="input-prefix">$</span>
        <input type="number" id="withdraw-input" placeholder="0.00" min="0.01" step="0.01">
      </div>
      <button class="btn btn-withdraw" onclick="handleWithdraw()">— Withdraw Funds —</button>
      <div class="msg" id="withdraw-msg"></div>
    </div>
  </div>

  <!-- Transaction History -->
  <div class="history-panel">
    <div class="history-header">
      <div class="history-title">Ledger</div>
      <div class="tx-count" id="tx-count">0 Transactions</div>
    </div>
    <div class="history-list" id="history-list">
      <div class="tx-empty" id="empty-msg">No transactions recorded</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-brand">Vault</div>
    <div class="footer-note">Secure · Private · Reliable</div>
  </footer>

</div>

<script>
  const account = { name: "Ali Khan", balance: 50000 };
  const transactions = [];

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('time-display').textContent =
      now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  function formatCurrency(n) {
    return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function updateBalanceDisplay() {
    const el = document.getElementById('balance-display');
    el.textContent = formatCurrency(account.balance);
    el.classList.remove('flash');
    void el.offsetWidth; // reflow
    el.classList.add('flash');

    const warn = document.getElementById('warning-banner');
    warn.classList.toggle('show', account.balance < 10000);
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
    setTimeout(() => { el.textContent = ''; el.className = 'msg'; }, 3500);
  }

  function addTransaction(type, amount) {
    const tx = {
      type,
      amount,
      balanceAfter: account.balance,
      date: new Date()
    };
    transactions.unshift(tx);
    renderTransactions();
  }

  function renderTransactions() {
    const list = document.getElementById('history-list');
    const count = document.getElementById('tx-count');
    count.textContent = transactions.length + ' Transaction' + (transactions.length !== 1 ? 's' : '');

    list.innerHTML = '';

    if (transactions.length === 0) {
      list.innerHTML = '<div class="tx-empty" id="empty-msg">No transactions recorded</div>';
      return;
    }
    transactions.forEach(tx => {
      const isDeposit = tx.type === 'deposit';
      const item = document.createElement('div');
      item.className = 'tx-item';
      item.innerHTML = `
        <div class="tx-icon">${isDeposit ? '↑' : '↓'}</div>
        <div class="tx-info">
          <div class="tx-type">${isDeposit ? 'Deposit' : 'Withdrawal'}</div>
          <div class="tx-date">${tx.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} · ${tx.date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>
        </div>
        <div class="tx-amount">
          <div class="tx-value ${tx.type}">${isDeposit ? '+' : '−'}$${formatCurrency(tx.amount)}</div>
          <div class="tx-balance">Bal: $${formatCurrency(tx.balanceAfter)}</div>
        </div>
      `;
      list.appendChild(item);
    });
  }

  function handleDeposit() {
    const input = document.getElementById('deposit-input');
    const amount = parseFloat(input.value);
    if (isNaN(amount) || amount <= 0) {
      showMsg('deposit-msg', 'Enter a valid positive amount', 'error');
      return;
    }
    account.balance += amount;
    addTransaction('deposit', amount);
    updateBalanceDisplay();
    showMsg('deposit-msg', `$${formatCurrency(amount)} deposited successfully`, 'success');
    input.value = '';
  }

  function handleWithdraw() {
    const input = document.getElementById('withdraw-input');
    const amount = parseFloat(input.value);
    if (isNaN(amount) || amount <= 0) {
      showMsg('withdraw-msg', 'Enter a valid positive amount', 'error');
      return;
    }
    if (amount > account.balance) {
      showMsg('withdraw-msg', 'Insufficient funds', 'error');
      return;
    }
    account.balance -= amount;
    addTransaction('withdrawal', amount);
    updateBalanceDisplay();
    showMsg('withdraw-msg', `$${formatCurrency(amount)} withdrawn successfully`, 'success');
    input.value = '';
  }

  // Enter key support
  document.getElementById('deposit-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleDeposit(); });
  document.getElementById('withdraw-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleWithdraw(); });

  updateBalanceDisplay();
</script>
</body>
</html>
